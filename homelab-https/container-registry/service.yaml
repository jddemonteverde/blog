apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
  labels:
    app: registry
spec:
  type: ClusterIP
  # Pinned: CI pushes here (buildkitd's config and the app workflows use this address).
  # Nodes pull through registry.lab.example.com instead; see ingress.yaml.
  clusterIP: <registry-ip>
  selector:
    app: registry
  ports:
    - name: http
      port: 5000
      targetPort: http
