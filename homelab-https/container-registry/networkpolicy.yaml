apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry
  namespace: registry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Traefik carries the nodes' pulls (registry.lab); buildkitd pushes from CI.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo-runner
          podSelector:
            matchLabels:
              app: buildkitd
      ports:
        - protocol: TCP
          port: 5000
